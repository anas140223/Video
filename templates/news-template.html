<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: #090d16;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 60px;
      overflow: hidden;
    }
    .header-badge {
      align-self: flex-start;
      background: #ef4444;
      color: #ffffff;
      font-weight: 800;
      font-size: 28px;
      padding: 12px 24px;
      border-radius: 6px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .content-box {
      background: rgba(30, 41, 59, 0.85);
      border-left: 8px solid #38bdf8;
      padding: 40px;
      border-radius: 12px;
      margin-top: auto;
      margin-bottom: 60px;
    }
    .headline {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.2;
      color: #f8fafc;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .summary {
      font-size: 32px;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .ticker-bar {
      background: #0284c7;
      color: #ffffff;
      padding: 20px 30px;
      font-size: 28px;
      font-weight: 700;
      border-radius: 8px;
      white-space: nowrap;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header-badge">BREAKING NEWS</div>
  
  <div class="content-box">
    <div class="headline">TECH GIANTS UNVEIL NEXT-GEN AI ACCELERATORS</div>
    <div class="summary">Major cloud infrastructure providers report record demand as enterprise adoption surges across global markets.</div>
  </div>

  <div class="ticker-bar">
    NVDA ▲ 5.2% | AMD ▲ 3.1% | INTC ▼ 0.8% | MSFT ▲ 1.9%
  </div>
</body>
</html>
